name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Syntax Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install linting tools
        run: pip install flake8 black

      - name: Python compile check
        run: |
          python -m py_compile $(find src/ -name "*.py")
          python -m py_compile $(find benchmark/ -name "*.py")
          python -m py_compile $(find tests/ -name "*.py")

      - name: Run flake8 (informative check)
        run: flake8 src/robot_arm/robot_arm/ benchmark/ --max-line-length=120 --ignore=E501,W503,E402,F401,F841 --exit-zero

  test:
    name: Academic & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          pip install pytest numpy scipy pybullet

      - name: Run test suite
        run: |
          pytest -v tests/
        env:
          PYTHONPATH: ./:src/robot_arm

  build:
    name: ROS 2 Jazzy Build Check
    runs-on: ubuntu-latest
    container:
      image: ros:jazzy
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y python3-pip python3-colcon-common-extensions
          rosdep update
          rosdep install --from-paths src/robot_arm --ignore-src -r -y || true

      - name: Build with colcon
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-select robot_arm --cmake-args -DCMAKE_BUILD_TYPE=Release
