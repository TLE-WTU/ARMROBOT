grasp_detection_node:
  ros__parameters:
    use_anygrasp: false
    grasp_mode: "heuristic"  # "heuristic", "hybrid" (AnyGrasp AI + Geometric Ensemble), "anygrasp"
    geometric_refinement: "ransac_primitive"  # "ransac_primitive", "obb", "pca", "normals", "slice"
    test_scenario: "default"
    checkpoint_path: ""  # Set via launch arg or ANYGRASP_CHECKPOINT env var
    socket_path: "/tmp/anygrasp_ipc.sock"
    max_gripper_width: 0.07
    gripper_height: 0.04
    top_down_grasp: true
    point_cloud_topic: "/camera/points"
    camera_frame: "camera_optical_link"
    base_frame: "base_link"
    enable_ransac: true
    benchmark_csv_path: ""  # Empty = auto-generate in /tmp
